# Static-site checks for msdynamic365.com.
#
# The job is named `validate` because the branch ruleset on main requires a
# status check with that name. Every check runs as its own step with
# `if: ${{ !cancelled() }}` so one failure never hides another; the last step
# names every failed check. scripts/check-ci-run-through.sh fails the build if
# a check step loses that condition.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        id: setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: HTML validation
        id: html
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npx --yes html-validate@11.6.2 "**/*.html"

      # Local links only. /cdn-cgi/ paths are generated by Cloudflare's edge,
      # not served from this repository.
      - name: Local link check
        id: links
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npx --yes linkinator@8.0.3 . --recurse --skip '^https://' --skip '/cdn-cgi/'

      - name: No localhost references
        id: localhost
        if: ${{ !cancelled() }}
        run: |
          if grep -rEn 'http://localhost|127\.0\.0\.1' --include=*.html --include=*.css --include=*.js .; then
            echo "::error::localhost reference found"
            exit 1
          fi

      - name: CI run-through policy
        id: policy
        if: ${{ !cancelled() }}
        run: bash scripts/check-ci-run-through.sh .github/workflows/ci.yml

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          HTML: ${{ steps.html.outcome }}
          LINKS: ${{ steps.links.outcome }}
          LOCALHOST: ${{ steps.localhost.outcome }}
          POLICY: ${{ steps.policy.outcome }}
        run: |
          failed=""
          [ "$HTML" = success ] || failed="$failed html-validate($HTML)"
          [ "$LINKS" = success ] || failed="$failed links($LINKS)"
          [ "$LOCALHOST" = success ] || failed="$failed localhost($LOCALHOST)"
          [ "$POLICY" = success ] || failed="$failed ci-policy($POLICY)"
          if [ -n "$failed" ]; then
            echo "::error::failed checks:$failed"
            exit 1
          fi
          echo "all checks passed"
